[project]
name = "cairn"
version = "0.1.0"
description = "AI-assisted workbench for authorized security assessment: recon, verification, evidence and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.1",
    "openai>=2.41.1",
    "openpyxl>=3.1.5",
    "patchright>=1.61.2",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "urllib3>=2.7",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["tmp"]
extend-exclude = ["TOOLS/js-tools/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"TOOLS/tests/**" = ["S101", "E402", "E741", "E501"]
"TOOLS/db/db_query.py" = ["S608"]
"TOOLS/recon/fofa_relay.py" = ["S501"]
"TOOLS/db/db_backup.py" = ["S603", "S607"]
"TOOLS/db/session_dash.py" = ["S608"]
"TOOLS/pipeline/init_scan.py" = ["S603", "S607"]
"warroom/server.py" = ["S608", "B007", "E741", "E501"]
"TOOLS/db/human_collaboration_replay.py" = ["E501"]
"TOOLS/db/cognitive_view.py" = ["E501"]
"TOOLS/db/cognitive_replay.py" = ["E501"]
"TOOLS/db/human_brief.py" = ["E501"]
"TOOLS/db/operator_actions.py" = ["E501"]
"TOOLS/db/system_registry.py" = ["E501"]
"TOOLS/db/experiments.py" = ["E501"]
"TOOLS/db/hunt_sessions.py" = ["E501"]
"TOOLS/db/recon_readiness.py" = ["E501"]
"TOOLS/db/burp_action_queue.py" = ["E501"]
"TOOLS/db/decisions.py" = ["E501"]
"TOOLS/db/experiment_planner.py" = ["E501"]
"TOOLS/db/profile_contract.py" = ["E501"]
"TOOLS/db/rebuild_target_db.py" = ["E501"]
"TOOLS/recon/preauth_probe.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["tmp/"]

[tool.pytest.ini_options]
testpaths = ["TOOLS/tests"]
norecursedirs = ["tmp", "TOOLS/js-tools/node_modules", ".git"]
